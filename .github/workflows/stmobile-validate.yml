name: stmobile validate

# Checks that AllTube still fits the SmartTube code it is built on: the phone flavor's hooks into
# upstream files are intact, the phone APK builds and its unit tests pass. A hook that upstream
# removes or narrows breaks the build anyway; these greps catch the ones that would fail silently.
# Runs on PRs and pushes, and upstream-sync calls it for every SmartTube merge before master.

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Verify the phone flavor's hooks into upstream code
        run: |
          set -e
          grep -E 'applicationId\s+"de\.rang3r1\.alltube"' smarttubetv/build.gradle
          grep -E "matchingFallbacks\s*=?\s*\['ststable'\]" smarttubetv/build.gradle
          grep -E 'stmobile\s*\{' common/build.gradle
          grep -E "matchingFallbacks\s*=?\s*\['ststable'\]" common/build.gradle
          grep -E 'protected\s+void\s+setupViewManager' \
            smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/ui/main/MainApplication.java
          echo "OK: all hooks present"

      # A phone layout with the same name as an upstream one hides it completely. If upstream adds
      # a view ID there, the code finds null at runtime while the build stays green.
      - name: Verify phone layout copies still have every upstream view ID
        shell: bash
        run: |
          set -e
          ids() { grep -oE '@\+?id/[A-Za-z0-9_]+' "$1" | sed -E 's#@\+?id/##' | sort -u; }
          fail=0
          for copy in smarttubetv/src/stmobile/res/layout/*.xml; do
            upstream="smarttubetv/src/main/res/layout/$(basename "$copy")"
            [ -f "$upstream" ] || continue
            missing=$(comm -23 <(ids "$upstream") <(ids "$copy"))
            if [ -n "$missing" ]; then
              echo "::error file=$copy::IDs from $upstream missing in the phone copy: $(echo $missing)"
              fail=1
            fi
          done
          [ "$fail" = 0 ] && echo "OK: layout copies complete"
          exit $fail

      - name: Build the phone APK and run its unit tests
        run: |
          chmod +x gradlew
          ./gradlew :smarttubetv:assembleStmobileDebug :smarttubetv:testStmobileDebugUnitTest --no-daemon
