name: Release

# Builds, signs and publishes AllTube as a GitHub release; the app's "Check for updates" reads
# these releases. Started by upstream-sync after a validated SmartTube merge, or by hand
# (Actions > Release > Run workflow) for AllTube's own changes.
#
# Version: v1.<run number>.0+st<SmartTube version>, versionCode 24000 + run number, so every run
# is newer than the last. Signing key and passwords come from the ALLTUBE_* repository secrets.
# Releases appear at https://github.com/rang3r1/AllTube/releases.

on:
  workflow_dispatch:
    inputs:
      notes:
        description: What changed
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Version
        id: version
        run: |
          # The first versionName in the module is upstream's defaultConfig, e.g. "32.68".
          BASE=$(grep -m1 -oP 'versionName "\K[0-9.]+' smarttubetv/build.gradle)
          echo "name=v1.${{ github.run_number }}.0+st$BASE" >> "$GITHUB_OUTPUT"
          echo "code=$((24000 + ${{ github.run_number }}))" >> "$GITHUB_OUTPUT"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ALLTUBE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ALLTUBE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALLTUBE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ALLTUBE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/alltube.jks"
          {
            echo "storeFile=$RUNNER_TEMP/alltube.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed APKs
        run: |
          chmod +x gradlew
          ./gradlew :smarttubetv:assembleStmobileRelease --no-daemon \
            -PalltubeVersionCode=${{ steps.version.outputs.code }} \
            -PalltubeVersionName=${{ steps.version.outputs.name }}

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
          NOTES: ${{ inputs.notes }}
        # Three steps instead of one `gh release create <files>`: with files gh first creates a
        # draft, which GITHUB_TOKEN was refused here (HTTP 403); tag, release and upload work.
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$VERSION" -f sha="$GITHUB_SHA"
          gh release create "$VERSION" --verify-tag --title "AllTube $VERSION" --notes "${NOTES:-AllTube $VERSION}"
          gh release upload "$VERSION" smarttubetv/build/outputs/apk/stmobile/release/*.apk
