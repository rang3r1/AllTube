name: Upstream sync

# Follows SmartTube's STABLE releases (tags like 32.68s, GitHub release with prerelease=false).
# When a new one is out: merge it into upstream-sync/<tag>, validate that branch (hooks, build,
# unit tests), then fast-forward master and start the release workflow. A merge conflict or a
# failed validation opens one issue for that tag instead, and later runs skip the tag until the
# issue is closed, so nothing broken reaches master and no build minutes are burnt on repeats.
# Run it by hand under Actions > Upstream sync > Run workflow.

on:
  schedule:
    - cron: '17 */6 * * *'  # every 6 h
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  merge:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      branch: ${{ steps.merge.outputs.branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find a new SmartTube stable release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh api repos/yuliskov/SmartTube/releases \
            --jq '[.[] | select(.prerelease == false and .draft == false)][0].tag_name')
          git fetch https://github.com/yuliskov/SmartTube.git "refs/tags/$TAG:refs/tags/$TAG"
          if git merge-base --is-ancestor "$TAG" HEAD; then
            echo "SmartTube $TAG is already in master."
            exit 0
          fi
          OPEN=$(gh issue list --state open --search "\"SmartTube $TAG\" in:title" --json number --jq length)
          if [ "$OPEN" != "0" ]; then
            echo "An issue for SmartTube $TAG is open; close it to retry."
            exit 0
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Merge into a sync branch
        id: merge
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="upstream-sync/$TAG"
          git checkout -B "$BRANCH"
          if ! git merge --no-ff -m "Merge SmartTube $TAG" "$TAG"; then
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            git merge --abort
            printf 'Merging SmartTube %s into master conflicts in:\n\n```\n%s\n```\n\nResolve it locally (git merge %s), push master, then close this issue.\n' \
              "$TAG" "$CONFLICTS" "$TAG" > /tmp/body.md
            gh issue create --title "SmartTube $TAG: merge conflict" --body-file /tmp/body.md
            exit 0
          fi
          git push --force origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

  validate:
    needs: merge
    if: needs.merge.outputs.branch != ''
    uses: ./.github/workflows/stmobile-validate.yml
    with:
      ref: ${{ needs.merge.outputs.branch }}

  publish:
    needs: [merge, validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Fast-forward master and start a release
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.merge.outputs.branch }}
          TAG: ${{ needs.merge.outputs.tag }}
        run: |
          git fetch origin "$BRANCH"
          git merge --ff-only FETCH_HEAD
          git push origin master
          git push origin --delete "$BRANCH"
          gh workflow run release.yml --ref master -f notes="- Basiert jetzt auf SmartTube $TAG."

  report-failure:
    needs: [merge, validate]
    if: failure() && needs.merge.outputs.branch != ''
    runs-on: ubuntu-latest
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.merge.outputs.tag }}
          BRANCH: ${{ needs.merge.outputs.branch }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "SmartTube $TAG: validation failed" \
            --body "The merge of SmartTube $TAG (branch \`$BRANCH\`) fails the hooks check, the build or the unit tests: $RUN. Fix it on that branch, merge it into master, then close this issue."
